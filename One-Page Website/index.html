<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manal Oraha | Digital Space</title>
    <style>
        /* Unique Neon & Glassmorphism Theme */
        :root {
            --primary-neon: #00f2ff;
            --secondary-neon: #7000ff;
            --bg-dark: #0a0b10;
            --glass: rgba(255, 255, 255, 0.05);
            --text-light: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 255, 0.15) 0%, transparent 40%);
            color: var(--text-light);
            line-height: 1.6;
            margin: 0;
            scroll-behavior: smooth;
        }

        /* Floating Navigation */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 10px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 25px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: var(--primary-neon);
            text-shadow: 0 0 10px var(--primary-neon);
        }

        section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 20px;
            max-width: 1100px;
            margin: auto;
        }

        /* Hero Section */
        #home h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            margin: 0;
            background: linear-gradient(to right, var(--primary-neon), var(--secondary-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        #home p {
            font-size: 1.2rem;
            max-width: 600px;
            text-align: center;
            color: #aaa;
        }

        /* Artistic Image Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .img-container {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            height: 300px;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(40%);
        }

        .img-container:hover img {
            filter: grayscale(0%);
            transform: scale(1.1);
        }

        /* Neon Form */
        form {
            background: var(--glass);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 500px;
        }

        input, textarea {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            margin-bottom: 20px;
            color: white;
            border-radius: 12px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-neon);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--secondary-neon), var(--primary-neon));
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Cinematic Video Area */
        .video-box {
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(112, 0, 255, 0.2);
            border: 1px solid rgba(255,255,255,0.05);
        }

        footer {
            text-align: center;
            padding: 40px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 40px;
        }

    </style>
</head>
<body>

    <nav>
        <a href="#home">Intro</a>
        <a href="#gallery">Vision</a>
        <a href="#video">Motion</a>
        <a href="#contact">Connect</a>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <h1>Manal Oraha</h1>
        <p>A digital creative exploring the intersection of code, design, and future technology.</p>
    </section>

    <!-- Visual Vision Section (Images) -->
    <section id="gallery">
        <h2>Visual Vision</h2>
        <div class="gallery">
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=600" alt="Abstract Art">
            </div>
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1633356122544-f134324a6cee?auto=format&fit=crop&q=80&w=600" alt="Code Concept">
            </div>
            <div class="img-container">
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=600" alt="Cyber Tech">
            </div>
        </div>
    </section>

    <!-- Motion Section (Video) -->
    <section id="video">
        <h2>Motion Concept</h2>
        <div class="video-box">
            <div style="aspect-ratio: 16/9; width: 100%;">
                <iframe 
                    width="100%" 
                    height="100%" 
                    src="https://www.youtube.com/embed/hVvEISFw9w0?autoplay=1&mute=1&loop=1&playlist=hVvEISFw9w0" 
                    title="Atmospheric Video" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Start a Conversation</h2>
        <form action="#">
            <input type="text" placeholder="Your Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <textarea rows="4" placeholder="Your Message..."></textarea>
            <button type="submit">Send Transmission</button>
        </form>
    </section>

    <footer>
        <p>Designed by Manal Oraha &copy; 2026 | Built for the Future</p>
    </footer>

</body>
</html>
